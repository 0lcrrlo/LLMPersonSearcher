[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-person-searcher"
version = "0.1.0"
description = "Natural-language person search over annotated CCTV frames"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.3"]
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
